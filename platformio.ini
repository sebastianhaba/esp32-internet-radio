; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

upload_speed = 921600
monitor_speed = 115200

debug_tool = esp-builtin
debug_port = localhost:3333
debug_init_break = tbreak setup
debug_server = 
  ${platformio.home_dir}/tools/tool-openocd-esp32/bin/openocd
  -d3
  -c
  gdb port 3333
  -f
  board/esp32s3-builtin.cfg
  -c
  adapter speed 2000

board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_build.partitions = partitions/littlefs.csv
build_flags = 
	-Os
	-Wall
    -Wextra
    -Wno-cpp                                 ; Disable #warning directive warnings
    -Wno-format                              ; Disable all format string warnings
    -Wno-unused-function
    -Wno-missing-field-initializers
	-D CORE_DEBUG_LEVEL=3
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USER_SETUP_LOADED=1
	-D ST7735_DRIVER=1
	-D ST7735_BLACKTAB=1
	-D TFT_WIDTH=128
	-D TFT_HEIGHT=160
	-D TFT_MISO=-1
	-D TOUCH_CS=-1
	-D TFT_SCLK=7
	-D TFT_MOSI=9
	-D TFT_DC=3
	-D TFT_RST=4
	-D TFT_CS=5
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_INVERSION_OFF=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_GFXFF=1 
	-D SMOOTH_FONT=1
	-D USE_HSPI_PORT=1

custom_component_remove =
	espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
   	espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
   	espressif/qrcode
    espressif/esp-sr
    espressif/libsodium
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
    espressif/esp32-camera

lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/schreibfaul1/ESP32-audioI2S.git
